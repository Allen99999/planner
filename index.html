<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3f3f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<title>Allen’s Planner</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  為什麼要這一層：
  1. 手機瀏覽器登入 Google 時，script.google.com 會把網址改成 /macros/u/1/s/…，公開的 Apps Script 網頁在那種網址下打不開。
     從這個網域用 iframe 打開就不會被改。
  2. Google 準備網頁要 1～2 秒，這段時間 iframe 是空白的。這一頁先畫出同一個開場畫面（吉祥物、輸入框、進度條），
     等真正的網頁說「我好了」再淡出，看起來就是同一個畫面接下去。期間打的字會交給真正的輸入框。
-->
<style>
  :root{ --bg: oklch(0.965 0 0); --ink: oklch(0.2 0 0); --line: oklch(0.9 0 0); }
  html, body{ margin:0; height:100%; background:var(--bg); overflow:hidden; }
  iframe{ position:fixed; inset:0; width:100%; height:100%; border:0; }
  .pre{ position:fixed; inset:0; z-index:2; background:var(--bg); transition: opacity .16s ease; }
  .pre.out{ opacity:0; pointer-events:none; }
  .cap{ position:absolute; top:50%; left:50%; translate:-50% -50%; width:min(640px, calc(100% - 24px)); height:64px; box-sizing:border-box; display:flex; align-items:center; gap:12px; padding:0 14px 0 16px; border-radius:999px;
    background: linear-gradient(180deg, oklch(1 0 0 / .72), oklch(1 0 0 / .5)); border:1px solid oklch(1 0 0 / .85);
    box-shadow: inset 0 1px 0 #fff, 0 0 0 1px oklch(0.2 0 0 / .06), 0 16px 40px -18px oklch(0.2 0 0 / .35); }
  .cap input{ flex:1; min-width:0; height:100%; border:0; outline:0; background:none; font: 500 17px -apple-system, "PingFang TC", sans-serif; color:var(--ink); }
  .cap input::placeholder{ color: oklch(0.42 0 0); font-weight:400; }
  .eyes{ flex:none; width:34px; height:30px; display:flex; gap:4px; align-items:center; justify-content:center; background:var(--ink); border-radius: 48% 52% 46% 54% / 58% 58% 42% 42%; }
  .eyes i{ width:9px; height:11px; border-radius:50%; background:#fff; display:grid; place-items:center; } .eyes b{ width:4.5px; height:4.5px; border-radius:50%; background:var(--ink); }
  .bar{ position:absolute; height:4px; border-radius:4px; background:var(--line); overflow:hidden; }
  .bar i{ display:block; height:100%; width:100%; border-radius:4px; background:var(--ink); transform-origin:0 50%; transform:scaleX(.04); animation: grow 2.4s cubic-bezier(.2,.6,.2,1) forwards; }
  @keyframes grow{ to{ transform:scaleX(.42); } }
  .mz{ position:absolute; left:0; top:0; }
  .mz svg{ display:block; width:100%; height:auto; overflow:visible; }
  .body{ fill:var(--ink); } .limb{ stroke:var(--ink); stroke-width:8.5; stroke-linecap:round; fill:none; } .eye{ fill:#fff; } .pupil{ fill:var(--ink); }
  .bob{ animation: bob .42s ease-in-out infinite alternate; } @keyframes bob{ to{ transform: translateY(-5px) rotate(-2.5deg); } }
  .legL{ transform-box:view-box; transform-origin:46px 90px; animation: step .42s ease-in-out infinite alternate; }
  .legR{ transform-box:view-box; transform-origin:74px 90px; animation: step .42s ease-in-out infinite alternate-reverse; }
  @keyframes step{ from{ transform: rotate(-26deg); } to{ transform: rotate(24deg); } }
  .armL{ transform-box:view-box; transform-origin:26px 68px; animation: swing .42s ease-in-out infinite alternate-reverse; }
  .armR{ transform-box:view-box; transform-origin:94px 68px; animation: swing .42s ease-in-out infinite alternate; }
  @keyframes swing{ from{ transform: rotate(-20deg); } to{ transform: rotate(20deg); } }
  @media (max-width: 760px){ .cap{ height:58px; padding-left:12px; } .cap input{ font-size:16px; } }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }
</style>
</head>
<body>
<div class="pre" id="pre" aria-hidden="true">
  <div class="mz" id="mz"><svg viewBox="0 0 120 110">
    <path class="limb legL" d="M46 90 L44 104"/><path class="limb legR" d="M74 90 L76 104"/>
    <path class="limb armL" d="M26 68 L12 82"/><path class="limb armR" d="M94 68 L108 82"/>
    <g class="bob"><path class="body" d="M60 26 C88 26 102 46 102 66 C102 84 84 94 60 94 C36 94 18 84 18 66 C18 46 32 26 60 26 Z"/>
    <ellipse class="eye" cx="46" cy="58" rx="11" ry="13"/><ellipse class="eye" cx="74" cy="58" rx="11" ry="13"/>
    <circle class="pupil" cx="47" cy="60" r="5"/><circle class="pupil" cx="75" cy="60" r="5"/></g></svg></div>
  <form class="cap" id="cap" onsubmit="return false"><span class="eyes"><i><b></b></i><i><b></b></i></span><input id="q" autocomplete="off" enterkeyhint="send" placeholder="想記什麼？隨手打一句" aria-label="快速記錄"></form>
  <div class="bar" id="bar"><i></i></div>
</div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbzWwXaekaAM2dhdYNZxLVHnSFC4A_ylsMzLxaybFrgzqc0HREC3UF-O_7uO0JpAkbgyVw/exec" title="Allen’s Planner" allow="clipboard-write"></iframe>
<script>
  /* same geometry as the app's loader, so the hand-off lines up */
  const pre=document.getElementById('pre'), mz=document.getElementById('mz'), cap=document.getElementById('cap'), bar=document.getElementById('bar'), q=document.getElementById('q');
  function lay(){ const mobile=innerWidth<760, MW=Math.round(mobile?innerWidth*.5:Math.min(270,innerHeight*.3)), MH=MW*110/120, c=cap.getBoundingClientRect(), w=Math.min(220,c.width*.38);
    mz.style.width=MW+'px'; mz.style.transform=`translate(${innerWidth/2-MW/2}px,${c.top-MH+MH*.06}px)`;
    Object.assign(bar.style,{left:(c.left+c.width/2-w/2)+'px',top:(c.bottom+22)+'px',width:w+'px'}); }
  lay(); addEventListener('resize',lay); q.focus();
  let done=false; function hide(){ if(done) return; done=true; pre.classList.add('out'); setTimeout(()=>pre.remove(),400); }
  addEventListener('message',e=>{ const d=e.data||{}; if(d.ld!=='up') return; if(!/(^https:\/\/[a-z0-9-]+\.googleusercontent\.com$)|(^https:\/\/script\.google\.com$)/.test(e.origin)) return;
    if(q.value && e.source) e.source.postMessage({ld:'text', v:q.value},'*'); hide(); });
  setTimeout(hide, 12000);   /* never get stuck on this layer */
</script>
</body>
</html>
