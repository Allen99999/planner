<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f5f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<title>Allen’s Planner</title>
<!--
  為什麼要這一層：手機瀏覽器登入了 Google 帳號時，script.google.com 會把網址改成 /macros/u/1/s/...，
  而公開的 Apps Script 網頁在那種網址下會顯示「目前無法開啟這個檔案」。
  從另一個網域用 iframe 打開時，瀏覽器不會帶 Google 的登入狀態，所以永遠走正確的網址。
-->
<style>
  html, body{ margin:0; height:100%; background:#f5f5f5; }
  iframe{ position:fixed; inset:0; width:100%; height:100%; border:0; }
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbzWwXaekaAM2dhdYNZxLVHnSFC4A_ylsMzLxaybFrgzqc0HREC3UF-O_7uO0JpAkbgyVw/exec" title="Allen’s Planner" allow="clipboard-write"></iframe>
</body>
</html>
